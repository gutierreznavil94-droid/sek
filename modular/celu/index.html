<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEK</title>
<style>
  html, body { margin: 0; height: 100%; background: #121110; color: #e8e2d6; overflow: hidden; }
  #pantalla { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #121110; }
  #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: serif; }
  #cargando b { font-size: 64px; color: #C8102E; font-weight: normal; }
  #cargando small { opacity: .6; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="cargando"><b>静</b><small id="estado">Abriendo…</small></div>
<iframe id="pantalla" hidden title="SEK"></iframe>
<script>
/*
 * La página madre. Abre la base UNA vez y muestra cada pantalla adentro (iframe).
 * Si esta misma página se abre ADENTRO del iframe (una pantalla fue a /hoy, /juego...),
 * no arranca nada: le pide a la madre que abra esa dirección.
 */
(function () {
  var madre = window.parent
  if (madre !== window && madre.SEK_IR) { madre.SEK_IR(location.pathname + location.search, true); return }

  var marco = document.getElementById('pantalla')
  var estado = document.getElementById('estado')

  /** Abre una dirección (/juego, /hoy?x=1): sigue redirecciones y muestra el archivo del paquete. */
  async function ir(camino, reemplazar) {
    for (var vueltas = 0; vueltas < 8; vueltas++) {
      var r = await window.SEK_LOCAL({ method: 'GET', url: camino })
      if (r.statusCode >= 300 && r.statusCode < 400 && r.headers.location) { camino = r.headers.location; continue }
      var archivo = r.headers['x-sek-archivo']
      if (r.statusCode === 200 && archivo) {
        var destino = '/' + archivo + '?__ruta=' + encodeURIComponent(camino)
        if (reemplazar && marco.contentWindow) marco.contentWindow.location.replace(destino)
        else marco.src = destino
        marco.hidden = false
        document.getElementById('cargando').hidden = true
        return
      }
      estado.textContent = 'No se pudo abrir ' + camino + ' (' + r.statusCode + ')'
      return
    }
  }
  window.SEK_IR = function (camino, reemplazar) { ir(camino, reemplazar).catch(mostrarError) }

  var fallo = false
  function mostrarError(e) { fallo = true; estado.textContent = 'Algo falló: ' + (e && e.message || e) }
  // En qué paso va el arranque (si algo se traba, se ve dónde) y cualquier error suelto.
  var ultimoPaso = Date.now()
  window.SEK_PASO = function (t) { if (!fallo) { estado.textContent = t; ultimoPaso = Date.now() } }
  window.addEventListener('error', function (e) { if (marco.hidden) mostrarError(e.message || 'error') })
  window.addEventListener('unhandledrejection', function (e) { if (marco.hidden) mostrarError(e.reason && e.reason.message || e.reason) })
  setInterval(function () {
    if (!marco.hidden || fallo) return
    var s = Math.round((Date.now() - ultimoPaso) / 1000)
    if (s >= 15) estado.textContent = estado.textContent.replace(/ \(hace \d+ s\)$/, '') + ' (hace ' + s + ' s)'
  }, 1000)

  var s = document.createElement('script')
  s.src = '/sek.js'
  estado.textContent = 'Cargando la app…'
  s.onload = function () {
    window.SEK_ARRANCAR().then(function () {
      var inicio = location.pathname === '/' || location.pathname === '/index.html' ? '/' : location.pathname + location.search
      return ir(inicio)
    }).then(rutaDeAndroid).catch(mostrarError)
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') rutaDeAndroid() })
  }

  /**
   * Lo que pidió Android al abrir SEK (se vacía al leerlo). «tension|TikTok|32»: te pasaste en una app de
   * «Apps que te atrapan» y tocaste la mano del Tajo → Hoy con el 3·2·1 brillando. «vigia» → esa pantalla.
   */
  function rutaDeAndroid() {
    var cap = window.Capacitor
    if (!cap || !cap.nativePromise || !(cap.isNativePlatform && cap.isNativePlatform())) return
    return cap.nativePromise('Sek', 'rutaPendiente', {}).then(function (r) {
      var ruta = r && r.ruta
      if (!ruta) return
      if (ruta.indexOf('tension|') === 0) {
        var p = ruta.split('|')
        return ir('/hoy?atrapado=' + encodeURIComponent(p[1] || '') + '&min=' + encodeURIComponent(p[2] || ''))
      }
      if (ruta === 'vigia') return ir('/juego/apps')
    }).catch(function () {})
  }
  s.onerror = function () { mostrarError('no está sek.js') }
  document.head.appendChild(s)
})()
</script>
</body>
</html>
