<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Progreso</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27: su estilo y el del tema Shinobi -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
</head>
<body>
  <main class="contenido">
    <!-- El guerrero bajo la lluvia va de fondo (fondo.js); encima, todo de vidrio. -->
    <div class="progreso-tinta" data-fondo="oscuro">
      <div class="av-contenido">
        <div class="av-hueco resumen"><span class="av-dato-flotante" id="flotante"></span></div>
        <p class="av-cargando" id="cargando">Cargando…</p>
        <div class="av-tarjetas" id="tarjetas" hidden>
          <section class="av-tarjeta av-fila-3 av-tocable" id="nivel" role="button" tabindex="0" aria-label="Nivel, XP y racha. Tocá para ver la tabla de niveles"></section>
          <section class="av-tarjeta camino-tarjeta" id="camino" aria-label="El camino" hidden></section>
          <div class="av-ninjas av-nota" id="caidas" hidden></div>
          <a class="av-tarjeta av-pilares-mini" id="pilares" href="/progreso/seccion?cual=pilares" hidden></a>
          <nav class="av-secciones" id="secciones" aria-label="Secciones de Progreso"></nav>
          <button type="button" class="av-ninjas av-nota marcas-linea" id="marcas" hidden></button>
          <section class="av-tarjeta fotos-tarjeta" id="fotos" aria-label="Fotos de progreso"></section>
        </div>
      </div>
    </div>
  </main>
  <input type="file" accept="image/*" id="archivo-foto" hidden>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <script src="/comun/v88-polvo.js"></script>
  <script src="/m/temas/companero.js"></script>
  <script src="/comun/v88.js"></script>
  <script src="/m/progreso/fondo.js"></script>
  <script src="/m/progreso/camino.js"></script>
  <script src="/m/progreso/progreso.js"></script>
</body>
</html>
