<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · XP</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <link rel="stylesheet" href="/comun/estilo.css">
  <link rel="stylesheet" href="/m/xp/estilo.css">
</head>
<body>
  <main>
    <h1>段 Nivel</h1>

    <section class="tarjeta" aria-live="polite">
      <div class="fila entre">
        <div class="nivel"><span class="chico">Nivel</span><span class="grande" id="nivel">1</span></div>
        <span class="frase" id="etapa">Inicio</span>
      </div>
      <div class="barra-progreso" role="progressbar" aria-label="Progreso al siguiente nivel"><span id="barra" style="width:0%"></span></div>
      <div class="fila entre chico"><span id="en-nivel"></span><span id="total"></span></div>
    </section>

    <section class="tarjeta">
      <div class="balances">
        <div><span class="chico">Hoy</span><b id="hoy-balance"></b></div>
        <div><span class="chico">Ayer</span><b id="ayer-balance"></b></div>
      </div>
    </section>

    <section class="tarjeta">
      <h3>Lo no cumplido resta</h3>
      <p class="chico">Al cerrar el día, cada pilar o serie que tocaba y no hiciste resta una parte de la XP que da. Nunca bajás de 0.</p>
      <div class="fila">
        <label class="interruptor"><input type="checkbox" id="resta-activa"> <span>Activo</span></label>
        <label class="porcentaje">Resta <select id="resta-porcentaje">
          <option value="25">25 %</option><option value="50">50 % (la mitad)</option><option value="75">75 %</option><option value="100">100 %</option>
        </select></label>
      </div>
      <p class="chico apagado" id="resta-desde"></p>
    </section>

    <section class="tarjeta">
      <h3>Movimientos</h3>
      <ul class="movimientos" id="movimientos"></ul>
      <button id="mas" hidden>Ver más</button>
    </section>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/m/xp/xp.js"></script>
</body>
</html>
