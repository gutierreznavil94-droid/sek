<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Fotos y días marcados</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <link rel="stylesheet" href="/comun/estilo.css">
  <link rel="stylesheet" href="/m/habitos/estilo.css">
</head>
<body>
  <main>
    <a class="chico" href="/habitos">‹ Mi código</a>
    <h1><span class="kanji hb-k">写</span> Fotos</h1>

    <section class="tarjeta" aria-label="Fotos de progreso">
      <div class="fila entre">
        <span class="chico" id="fotos-cuenta"></span>
        <span class="fila">
          <button type="button" id="comparar" hidden>Comparar</button>
          <button type="button" class="principal" id="subir">+ Foto de hoy</button>
        </span>
      </div>
      <input type="file" id="archivo" accept="image/*" hidden>
      <p class="chico" id="fotos-vacio" hidden>Opcional: una foto el Día 1, otra el Día 20… queda con el día en que la cargás.</p>
      <p class="chico" id="comparar-ayuda" hidden>Elegí dos fotos para verlas lado a lado.</p>
      <div class="hb-fotos" id="fotos"></div>
      <div class="hb-par" id="par" hidden></div>
      <p class="chico apagado" id="fotos-ayuda" hidden>Tocá una foto para verla grande o borrarla.</p>
    </section>

    <h2><span class="kanji hb-k">印</span> Días marcados</h2>
    <section class="tarjeta" aria-label="Días marcados">
      <form id="marcar" class="hb-ajustes">
        <label>Día <input type="date" name="fecha" required></label>
        <label>¿Qué pasó ese día? <input name="texto" maxlength="80" required placeholder="Ej.: primer día sin celu"></label>
        <button type="submit" class="principal">印 Marcar</button>
      </form>
      <ul class="hb-lista" id="marcas"></ul>
    </section>
  </main>

  <dialog class="hb-hoja" id="hoja" aria-labelledby="hoja-titulo">
    <form method="dialog" class="hb-hoja-in">
      <div class="fila entre"><h2 id="hoja-titulo"></h2><button value="cerrar" aria-label="Cerrar">✕</button></div>
      <div id="hoja-cuerpo" class="hb-hoja-cuerpo"></div>
    </form>
  </dialog>

  <script src="/comun/marco.js"></script>
  <script src="/m/habitos/fotos.js"></script>
</body>
</html>
