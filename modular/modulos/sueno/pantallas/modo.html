<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SEK · Modo sueño</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27 (ModoSuenio.tsx): su estilo y el del tema Shinobi -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
  <style>
    /* Solo de esta pantalla: el lugar de la escena del shinobi. */
    .suenio-escena { width: min(320px, 86vw); margin: 0 auto 8px; }
    .suenio-escena:empty { display: none; }
    body { background: #000; }
  </style>
</head>
<body>
  <div class="modo-suenio" id="modo" role="dialog" aria-label="Modo sueño">
    <div class="suenio-saludo" id="saludo" hidden>
      <div class="suenio-escena" id="escena-saludo"></div>
      <div class="suenio-titulo" id="saludo-titulo">Buenas noches</div>
      <div class="suenio-resumen" id="saludo-resumen"></div>
      <div class="suenio-nota" id="saludo-xp" hidden>Celu dejado a tiempo. +XP guardado.</div>
      <div class="suenio-nota">Tocá para pasar al reloj</div>
    </div>
    <div class="suenio-reloj" id="reloj" hidden>
      <div class="suenio-hora" id="hora">--:--</div>
      <div class="suenio-escena" id="escena-reloj"></div>
      <div class="suenio-linea" id="hasta"></div>
      <div class="suenio-linea" id="dormido"></div>
      <div class="suenio-nota" id="aperturas" hidden></div>
    </div>
    <div class="suenio-saludo" id="buenos-dias" hidden>
      <div class="suenio-titulo">Buenos días</div>
      <a class="boton primario" href="/sueno">Ver cómo dormí</a>
    </div>
    <button type="button" class="suenio-salir" id="salir">Salir del modo sueño</button>
  </div>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <script src="/comun/v88.js"></script>
  <script src="/comun/hoja-clip.js"></script>
  <script src="/m/sueno/escena.js"></script>
  <script src="/m/sueno/modo.js"></script>
</body>
</html>
