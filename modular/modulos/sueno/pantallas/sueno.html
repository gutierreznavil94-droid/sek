<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Sueño</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27: su estilo y el del tema Shinobi -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
</head>
<body>
  <main class="contenido">
    <div class="pagina-sueno">
      <h1 class="sueno-titulo"><span class="sueno-kanji" aria-hidden="true">眠</span>Sueño</h1>

      <!-- Anoche: una tarjeta baja, dos líneas (tocar corrige las horas). -->
      <button type="button" class="tarjeta anoche-baja" id="anoche" aria-label="Anoche. Tocá para corregir las horas">
        <span class="anoche-grande" id="anoche-grande">Anoche · sin registro</span>
        <span class="muy-chico texto-3" id="anoche-chica">Se completa solo con «Dejo celu» · tocá para cargarlo a mano</span>
      </button>

      <section class="tarjeta">
        <div class="tarjeta-cab">
          <h2>Noches</h2>
          <div class="seg" role="tablist" aria-label="Rango del gráfico">
            <button role="tab" data-rango="semana">Semana</button>
            <button role="tab" data-rango="mes">Mes</button>
            <button role="tab" data-rango="ciclo">Ciclo</button>
          </div>
        </div>
        <div id="grafico"><p class="texto-2 chico">Cargando…</p></div>
      </section>

      <section class="tarjeta">
        <div class="tarjeta-cab"><h2>Tu adaptación</h2><button type="button" class="boton chico" id="editar-adaptacion">Editar</button></div>
        <div class="sh-dice">
          <div id="escena"></div>
          <div class="sh-barra" id="etapas-barra" role="group" aria-label="Dónde estás en la adaptación"></div>
          <div class="tema-globo sh-globo" role="status"><span class="tema-globo-kanji" aria-hidden="true">眠</span><p class="sh-texto" id="discurso"></p></div>
        </div>
        <div class="col sueno-adaptacion-form" id="form-adaptacion" style="gap: 10px;" hidden></div>
      </section>

      <section class="tarjeta">
        <div class="tarjeta-cab"><h2>Cómo vas mejorando</h2></div>
        <div class="sueno-cifras" id="cifras"></div>
      </section>

      <button type="button" class="boton chico suave ajustes-sueno-boton" id="abrir-ajustes">⚙ Ajustes del sueño</button>
    </div>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <script src="/comun/v88-polvo.js"></script>
  <script src="/m/temas/companero.js"></script>
  <script src="/comun/v88.js"></script>
  <script src="/comun/hoja-clip.js"></script>
  <script src="/m/sueno/escena.js"></script>
  <script src="/m/sueno/sueno.js"></script>
</body>
</html>
