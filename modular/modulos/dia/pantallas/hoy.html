<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Hoy</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27: su estilo, el del tema Shinobi y el de la tira de Organización -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
  <link rel="stylesheet" href="/m/organizacion/estilo.css">
  <link rel="stylesheet" href="/m/dia/hoy.css">
</head>
<body>
  <main class="contenido">
    <!-- Sin ciclo todavía: elegir el Día 1 -->
    <section class="tarjeta" id="empezar" hidden>
      <h2>Empezar mi ciclo</h2>
      <p class="chico texto-2">Tu ciclo es de 90 días en 3 fases de 30. Los pilares empiezan a contar desde el Día 1. Todo se puede cambiar después en Ciclo.</p>
      <form id="form-empezar" class="col" style="gap: 10px;">
        <div class="campo"><label>Día 1</label><input type="date" name="inicio" required></div>
        <div class="campo"><label>Días del ciclo</label><input type="number" name="duracionDias" min="7" max="3650" value="90" required></div>
        <label class="fila chico"><input type="checkbox" name="diaCero"> Hacer un Día 0 de calentamiento (el día antes, sin restar XP)</label>
        <button class="boton primario ancho grande" type="submit">Empezar mi ciclo</button>
      </form>
    </section>

    <!-- Ciclo que todavía no empieza: cuántos días faltan -->
    <section class="col" id="antes" hidden style="gap: 6px; padding: 8px 0;"></section>

    <div id="tablero" hidden>
      <!-- Fin de fase o de ciclo: llevan al Cierre de fase (módulo progreso) -->
      <div id="fin-fase" hidden></div>
      <div class="avisos" id="avisos" role="alert" hidden></div>
      <p class="ajuste-ayer" id="ajuste-ayer" hidden></p>

      <section class="col pilares-hoy" style="gap: 6px;" aria-label="Pilares de hoy">
        <div class="fila entre">
          <span class="seccion-titulo">Pilares de hoy <span class="seccion-nota">(tocá para registrar o iniciar)</span></span>
          <span class="mono chico" style="font-weight: 700;" id="cuenta-pilares"></span>
        </div>
        <!-- Los pilares y la Revisión diaria (barra fina) en el mismo recuadro, así se ve apenas abrís Hoy -->
        <div class="grupo-pilares">
          <div class="pilares-bloques" id="pilares"></div>
          <a class="revision-fina" id="revision" href="/ciclo/revision"></a>
        </div>
        <p class="linea-horario muy-chico texto-3 centro" id="linea-noche"></p>
        <button class="boton celu ancho grande" id="dejo-celu" hidden>Dejo celu</button>
        <p class="muy-chico texto-3 centro" id="celu-dejado" style="margin: 0;" hidden></p>
      </section>

      <section class="col" style="gap: 6px;" aria-label="Series rápidas" id="series" hidden></section>
      <section class="semana-metas simple" aria-label="Metas de la semana" id="metas"></section>

      <section class="co-tarjeta fina" aria-label="Comida" id="comida" hidden></section>
      <section class="agua-tarjeta" aria-label="Agua" id="agua-aparte" hidden></section>
      <!-- habitos: «鍛 En forja», hasta 3 cuadritos en una fila (si no hay hábitos en forja, no aparece) -->
      <section class="forja-hoy" aria-label="Hábitos en forja" id="forja-hoy" hidden></section>

      <div class="col accesos" style="gap: 8px;" id="accesos"></div>

      <section class="col" style="gap: 6px;" id="otros" hidden></section>

      <div id="organizacion"></div>
    </div>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <!-- La cabecera que se hace polvo (de todas las pantallas) y, del tema, el papel mojado y el compañero -->
  <script src="/comun/v88-polvo.js"></script>
  <script src="/m/temas/papel-mojado.js"></script>
  <script src="/m/temas/companero.js"></script>
  <script src="/comun/v88.js"></script>
  <!-- desafios: frase «Dudar es fracasar» y el Tajo (si el módulo todavía no está, no pasa nada) -->
  <script src="/m/desafios/capa.js" onerror="this.remove()"></script>
  <!-- habitos: la piedra del tema, el juramento y la fila «En forja» (si el módulo no está, no pasa nada) -->
  <script src="/m/temas/piedra.js" onerror="this.remove()"></script>
  <script src="/m/habitos/juramento.js" onerror="this.remove()"></script>
  <script src="/m/habitos/forja-hoy.js" onerror="this.remove()"></script>
  <script src="/m/dia/hoy.js"></script>
</body>
</html>
