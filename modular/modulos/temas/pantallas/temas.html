<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Tema y nombres</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27 (Más → Tema y nombres): su estilo y el del tema Shinobi -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
</head>
<body>
  <main class="contenido">
    <a class="atras" href="/mas">← Más</a>
    <h1>Tema y nombres</h1>
    <section class="tarjeta">
      <div class="tarjeta-cab"><h2>Tema</h2></div>
      <p class="chico texto-2">La cara de la app: personaje, fondos y color. Cambiarlo no toca tu XP, tus pilares ni tu historial.</p>
      <div class="pv-temas" id="temas"><p class="vacio">Cargando…</p></div>
    </section>
    <section class="tarjeta" id="nombres">
      <div class="tarjeta-cab"><h2>Nombres</h2></div>
      <div class="campo"><label for="tn-app">Nombre de la app</label><input id="tn-app" maxlength="20"></div>
      <div class="campo"><label for="tn-nombre">Tu nombre</label><input id="tn-nombre" maxlength="40" placeholder="Opcional"></div>
      <div class="separador"></div>
      <p class="chico texto-2">Nombres de las fases del ciclo (se ven en la barra de arriba).</p>
      <div class="col" id="fases" style="gap: 10px;"></div>
      <button type="button" class="boton primario ancho" id="guardar">Guardar nombres</button>
    </section>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <script src="/comun/v88-polvo.js"></script>
  <script src="/m/temas/companero.js"></script>
  <script src="/comun/v88.js"></script>
  <script src="/m/temas/temas.js"></script>
</body>
</html>
