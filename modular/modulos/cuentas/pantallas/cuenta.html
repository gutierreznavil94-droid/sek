<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Cuenta</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <link rel="stylesheet" href="/comun/estilo.css">
  <link rel="stylesheet" href="/m/cuentas/estilo.css">
</head>
<body>
  <main>
    <a class="atras" href="/mas">‹ Más</a>
    <h1>Cuenta</h1>
    <section class="tarjeta">
      <div class="fila entre"><span class="chico">Nombre</span><span id="nombre"></span></div>
      <div class="fila entre"><span class="chico">Email</span><span id="email"></span></div>
    </section>
    <form id="form" class="tarjeta">
      <h3>Cambiar contraseña</h3>
      <label>Contraseña actual <input id="actual" type="password" autocomplete="current-password" required></label>
      <label>Nueva (8 o más) <input id="nueva" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repetir la nueva <input id="repetir" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="chico">Al cambiarla se cierran las sesiones de otros teléfonos o compus. Esta sigue abierta.</p>
      <button class="principal" type="submit">Cambiar contraseña</button>
    </form>
    <button class="peligro" id="salir">Salir de esta cuenta</button>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/m/cuentas/cuenta.js"></script>
</body>
</html>
