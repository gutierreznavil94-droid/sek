<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SEK · Más</title>
  <link rel="icon" href="/comun/favicon-32.png">
  <!-- Igual que la v0.88.27: su estilo y el del tema Shinobi -->
  <link rel="stylesheet" href="/comun/v88.css">
  <link rel="stylesheet" href="/m/temas/shinobi/visual.css">
</head>
<body>
  <main class="contenido">
    <h1>Más</h1>
    <label class="mas-buscar">
      <span class="mas-lupa" aria-hidden="true">⌕</span>
      <input type="search" id="buscar" placeholder="Buscar…" aria-label="Buscar en Más">
      <button type="button" class="mas-borrar" id="borrar" aria-label="Borrar búsqueda" hidden>×</button>
    </label>
    <section class="tarjeta compacta" id="aviso-copia" hidden>
      <div class="fila entre"><span class="chico" id="aviso-copia-texto"></span><a class="boton chico primario" href="/mas/copia">Exportar</a></div>
    </section>
    <nav class="mas-sistema" id="sistema" aria-label="La app"></nav>
    <div id="grupos"></div>
    <div class="mas-nada" id="nada" hidden><p class="texto-2 centro">Nada con eso.</p></div>
    <p class="ayuda centro" id="ayuda-datos">Los datos viven solo en este teléfono. Si desinstalás la app, se pierden: exportá una copia cada semana.</p>
    <div class="mas-pie chico"><span class="texto-3" id="version"></span></div>
  </main>
  <script src="/comun/marco.js"></script>
  <script src="/comun/v88-dibujos.js"></script>
  <script src="/comun/v88-polvo.js"></script>
  <script src="/m/temas/companero.js"></script>
  <script src="/comun/v88.js"></script>
  <script src="/m/cuentas/mas.js"></script>
</body>
</html>
